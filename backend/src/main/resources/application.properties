server.address=${BIND_ADDRESS:127.0.0.1}
server.port=${PORT:8080}
server.error.include-message=never
server.servlet.session.timeout=12h
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
spring.datasource.url=jdbc:h2:file:${NOTES_DATA_DIR:../.data}/notes;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=${DB_PASSWORD:}
spring.flyway.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
spring.web.resources.static-locations=file:../frontend/dist/
notes.data-dir=${NOTES_DATA_DIR:../.data}
notes.public-access=${PUBLIC_ACCESS_ENABLED:false}
notes.local-login=${LOCAL_LOGIN_ENABLED:true}
spring.jackson.default-property-inclusion=non_null
server.max-http-request-header-size=16KB
